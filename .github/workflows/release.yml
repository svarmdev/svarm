name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release tag
        shell: bash
        run: |
          package_version="$(cargo pkgid -p svarm | sed 's/.*#//')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || {
            echo "tag $GITHUB_REF_NAME does not match svarm package version $package_version"
            exit 1
          }
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          archive="svarm-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/svarm" dist/svarm
          tar -C dist -czf "dist/${archive}.tar.gz" svarm
          rm dist/svarm
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Svarm $GITHUB_REF_NAME" \
            --generate-notes
