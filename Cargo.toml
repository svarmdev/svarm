[package]
name = "svarm"
version = "0.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A terminal workspace for coding agents"

[workspace]
members = ["crates/svarm-agent", "crates/svarm-tui"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/svarmdev/svarm"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde_json = "1.0"
svarm-agent = { path = "crates/svarm-agent" }
svarm-tui = { path = "crates/svarm-tui" }

[patch.crates-io]
vt100-psmux = { path = "vendor/vt100-psmux" }
