[package]
name = "svarm"
version = "0.1.0"
edition = "2024"
description = "A small terminal multiplexer for coding agents"

[workspace]
members = ["crates/svarm-agent", "crates/svarm-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
svarm-tui = { path = "crates/svarm-tui" }
