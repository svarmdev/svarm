[package]
name = "svarm"
version = "0.1.0"
edition = "2024"
description = "A small terminal multiplexer for coding agents"

[workspace]
members = ["crates/svarm-agent", "crates/svarm-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
svarm-agent = { path = "crates/svarm-agent" }
svarm-tui = { path = "crates/svarm-tui" }

[patch.crates-io]
vt100-psmux = { path = "vendor/vt100-psmux" }
